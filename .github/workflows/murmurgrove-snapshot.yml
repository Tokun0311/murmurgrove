name: Preserve Murmurgrove archive history
on:
  push:
    branches: [main, master]
    paths:
      - 'src/data/exhibitions/**'
      - 'src/data/people/**'
      - 'src/data/institutions/**'
      - 'src/data/concepts/**'
      - 'src/data/writing/**'
      - 'src/data/photography/**'
      - 'src/content.config.ts'
      - 'scripts/record-murmurgrove-snapshot.py'
      - 'scripts/export-murmurgrove-history.mjs'
      - 'src/pages/index.astro'
      - 'src/lib/murmurgrove.ts'
      - 'scripts/murmurgrove-model-stdin.mjs'
      - 'src/styles/global.css'
      - 'src/data/murmurgrove-model.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/record-murmurgrove-snapshot.py
      - run: node scripts/export-murmurgrove-history.mjs
      - name: Commit snapshot only if new
        run: |
          git add src/data/murmurgrove-history/ public/murmurgrove/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "archive: preserve Murmurgrove content and design state"
            git push
          fi
      - name: Update optional shared organism service
        if: ${{ success() }}
        env:
          GROVE_ENDPOINT: ${{ secrets.GROVE_STATE_ENDPOINT }}
          GROVE_INGEST_SECRET: ${{ secrets.GROVE_INGEST_SECRET }}
        run: |
          if [ -n "$GROVE_ENDPOINT" ] && [ -n "$GROVE_INGEST_SECRET" ]; then
            curl --fail --show-error --silent --retry 3 \
              -H "Authorization: Bearer $GROVE_INGEST_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @public/murmurgrove/current-graph.json \
              "${GROVE_ENDPOINT%/}/ingest"
          else
            echo 'Shared state not configured; static archive history updated.'
          fi
